<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="bg-ml" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dafbe1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="160" fill="url(#bg-ml)"/>
  <!-- Neural network -->
  <!-- Layer 1 -->
  <circle cx="160" cy="50" r="7" fill="#2da44e" opacity="0.7"/>
  <circle cx="160" cy="110" r="7" fill="#2da44e" opacity="0.7"/>
  <!-- Layer 2 -->
  <circle cx="300" cy="35" r="7" fill="#1a7f37" opacity="0.7"/>
  <circle cx="300" cy="80" r="7" fill="#1a7f37" opacity="0.7"/>
  <circle cx="300" cy="125" r="7" fill="#1a7f37" opacity="0.7"/>
  <!-- Layer 3 -->
  <circle cx="440" cy="80" r="7" fill="#0969da" opacity="0.7"/>
  <!-- Connections -->
  <line x1="160" y1="50" x2="300" y2="35" stroke="#2da44e" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="50" x2="300" y2="80" stroke="#2da44e" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="50" x2="300" y2="125" stroke="#2da44e" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="110" x2="300" y2="35" stroke="#2da44e" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="110" x2="300" y2="80" stroke="#2da44e" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="110" x2="300" y2="125" stroke="#2da44e" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="35" x2="440" y2="80" stroke="#1a7f37" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="80" x2="440" y2="80" stroke="#1a7f37" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="125" x2="440" y2="80" stroke="#1a7f37" stroke-width="1" opacity="0.3"/>
  <!-- Labels -->
  <text x="160" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#656d76">Input</text>
  <text x="300" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#656d76">Hidden</text>
  <text x="440" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#656d76">Output</text>
</svg>
