<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="bg-komp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbefff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="160" fill="url(#bg-komp)"/>
  <!-- Genetic algorithm / swarm -->
  <!-- Best path curve -->
  <path d="M 100 120 Q 200 40, 300 80 T 500 60" fill="none" stroke="#a371f7" stroke-width="2" opacity="0.5"/>
  <!-- Population dots -->
  <circle cx="110" cy="115" r="5" fill="#a371f7" opacity="0.6"/>
  <circle cx="115" cy="125" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="105" cy="130" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="200" cy="55" r="5" fill="#a371f7" opacity="0.6"/>
  <circle cx="210" cy="45" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="195" cy="65" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="300" cy="75" r="5" fill="#a371f7" opacity="0.6"/>
  <circle cx="310" cy="85" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="290" cy="90" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="500" cy="60" r="5" fill="#8250df" opacity="0.8"/>
  <circle cx="510" cy="55" r="5" fill="#a371f7" opacity="0.4"/>
  <circle cx="495" cy="70" r="5" fill="#a371f7" opacity="0.4"/>
  <!-- Convergence arrow -->
  <path d="M 105 135 L 495 72" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
</svg>
