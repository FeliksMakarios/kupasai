<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="bg-nlp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddf4ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="160" fill="url(#bg-nlp)"/>
  <!-- Word nodes -->
  <circle cx="150" cy="80" r="8" fill="#0969da" opacity="0.8"/>
  <circle cx="220" cy="50" r="8" fill="#a371f7" opacity="0.8"/>
  <circle cx="290" cy="100" r="8" fill="#2da44e" opacity="0.8"/>
  <circle cx="360" cy="60" r="8" fill="#e3b341" opacity="0.8"/>
  <circle cx="430" cy="90" r="8" fill="#fb8f44" opacity="0.8"/>
  <!-- Connecting lines -->
  <line x1="150" y1="80" x2="220" y2="50" stroke="#0969da" stroke-width="1.5" opacity="0.3"/>
  <line x1="220" y1="50" x2="290" y2="100" stroke="#0969da" stroke-width="1.5" opacity="0.3"/>
  <line x1="290" y1="100" x2="360" y2="60" stroke="#0969da" stroke-width="1.5" opacity="0.3"/>
  <line x1="360" y1="60" x2="430" y2="90" stroke="#0969da" stroke-width="1.5" opacity="0.3"/>
  <line x1="150" y1="80" x2="290" y2="100" stroke="#0969da" stroke-width="1" opacity="0.15"/>
  <line x1="220" y1="50" x2="360" y2="60" stroke="#0969da" stroke-width="1" opacity="0.15"/>
  <!-- Word labels -->
  <text x="150" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#656d76">raja</text>
  <text x="220" y="35" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#656d76">ratu</text>
  <text x="290" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#656d76">pria</text>
  <text x="360" y="45" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#656d76">wanita</text>
  <text x="430" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#656d76">anak</text>
</svg>
